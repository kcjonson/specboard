name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Bootstrap mode - deploy infrastructure only (skip image build and service deploy)'
        required: false
        type: boolean
        default: false

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # compare this run's commit against main's head
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Get commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Check if this commit still carries main's code
        id: check
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          echo "sha=$SHA" >> $GITHUB_OUTPUT

          # Only one commit deploys, and it is the newest one whose code main has not
          # moved past. That is deliberately weaker than "is the head commit": CI skips
          # documentation-only pushes (see ci.yml's paths-ignore), so those never produce
          # a CD run of their own. A plain head comparison would let a documentation
          # commit landing right behind a code commit strand that code undeployed, with
          # no later run to correct it.
          #
          # So compare by content instead. If everything main has gained since this
          # commit is documentation, this commit's code is still main's code and it
          # deploys. Anything else means a real code commit is behind us in the queue
          # and its own run will deploy it.
          #
          # Keep the pattern below in sync with ci.yml's paths-ignore.
          CMP=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/compare/$SHA...main")

          STATUS=$(echo "$CMP" | jq -r '.status // empty')

          echo "This commit: $SHA"
          echo "vs main:     ${STATUS:-<unknown>}"

          # An empty response is a real API outage. Fail loudly rather than deploy a
          # possibly-stale commit or silently skip a fresh one.
          if [ -z "$STATUS" ]; then
            echo "::error::Could not compare $SHA against main (empty API response); not deploying. Re-run once the lookup succeeds."
            exit 1
          fi

          # Only `identical` and `ahead` mean this commit is one main is built on, and
          # only then does the file list below mean "what main gained since it". A
          # dispatch from a ref that is not on main, or rewritten history, lands on
          # `behind` or `diverged`, where the same list means something else entirely.
          # Staging deploys from main; refuse rather than guess.
          case "$STATUS" in
            identical|ahead) ;;
            *)
              echo "::error::$SHA is '$STATUS' relative to main, so it is not a commit main is built on; not deploying."
              exit 1
              ;;
          esac

          CODE_AHEAD=$(echo "$CMP" | jq -r '.files[]?.filename' \
            | grep -vE '^(docs/|[^/]+\.md$|([^/]+/)*README\.md$)' || true)

          if [ -n "$CODE_AHEAD" ]; then
            echo "main has newer code; that commit's own run will deploy it. Skipping:"
            printf '%s\n' "$CODE_AHEAD" | sed 's/^/  /'
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          fi

  build-push:
    name: Build and Push
    needs: check
    if: needs.check.outputs.should_deploy == 'true' && inputs.bootstrap != true
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_build-images.yml
    with:
      push: true
      # Pin to the commit `check` cleared, not github.sha. Under workflow_run the latter
      # is main's head, which is not necessarily this run's commit, and deploy-services
      # below asks ECS for the tag `check` chose.
      ref: ${{ needs.check.outputs.sha }}
    secrets: inherit

  setup-aws:
    name: Setup AWS Resources
    needs: [check, build-push]
    if: "!cancelled() && (inputs.bootstrap == true || needs.build-push.result == 'success')"
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy-cdk.yml
    with:
      action: deploy
      environment: staging
      bootstrap: ${{ inputs.bootstrap || false }}
    secrets: inherit

  migrate:
    name: Run Migrations
    needs: setup-aws
    if: inputs.bootstrap != true
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_run-ecs-task.yml
    with:
      task_name: migrate
      command: '["node", "shared/db/src/migrate.ts"]'
      environment: staging
    secrets: inherit

  seed:
    name: Seed Database
    needs: migrate
    if: inputs.bootstrap != true
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_run-ecs-task.yml
    with:
      task_name: seed
      command: '["node", "shared/db/seed.mjs"]'
      include_superadmin_env: true
      environment: staging
    secrets: inherit

  deploy-services:
    name: Deploy Services
    needs: [check, seed]
    if: inputs.bootstrap != true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Deploy services
        run: |
          source .github/scripts/get-stack-outputs.sh SpecboardStaging
          .github/scripts/deploy-services.sh "${{ needs.check.outputs.sha }}"
