name: CI

on:
  # Documentation is never linted, typechecked, tested, or baked into an image, so a
  # diff made only of documentation has nothing for CI to check, and because CD is
  # triggered by CI's completion, skipping CI skips the staging deploy too.
  #
  # The list is deliberately narrow: root-level markdown only, never `**/*.md`.
  # `api/src/prompts/*.md` is shipped prompt payload and `plugins/specboard/**/*.md`
  # is published in the plugin package; both are code. GitHub's workflow parser
  # rejects YAML anchors, hence the repetition.
  #
  # Keep in sync with the doc-path pattern in cd.yml's `check` job.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/README.md'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  build-images:
    name: Build Images
    needs: [lint, typecheck, test]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_build-images.yml
    with:
      push: false
